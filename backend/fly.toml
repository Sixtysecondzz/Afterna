# fly.toml app configuration file generated for afterna on 2026-08-07T23:42:25Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'afterna'
primary_region = 'syd'

[build]

[env]
  FIXTURE_MODE = 'false'
  NODE_ENV = 'production'
  PORT = '8080'

[processes]
  app = 'npx tsx src/index.ts'
  worker = 'npx tsx src/worker.ts'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
  processes = ['worker']
