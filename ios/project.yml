name: Afterna
options:
  bundleIdPrefix: app.afterna
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    ONLY_ACTIVE_ARCH: YES
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: "12.0.0"
targets:
  Afterna:
    type: application
    platform: iOS
    sources:
      - path: Afterna
        excludes:
          - "**/.DS_Store"
          - "Info.plist"
          - "Afterna.entitlements"
      - path: local/ConversationCore/Sources/ConversationCore
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.afterna.ios
        PRODUCT_NAME: Afterna
        DEVELOPMENT_TEAM: V5GB46FZ48
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Afterna/Info.plist
        CODE_SIGN_ENTITLEMENTS: Afterna/Afterna.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Afterna
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Afterna records conversations you choose to capture.
        INFOPLIST_KEY_NSCalendarsUsageDescription: Afterna uses your calendar to suggest titles for meetings you record.
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: Afterna uses your calendar to suggest titles for meetings you record.
        INFOPLIST_KEY_NSUserNotificationsUsageDescription: Afterna notifies you when a meeting is starting and when your notes are ready.
        INFOPLIST_KEY_UIBackgroundModes: [audio]
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "0.1.0"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ONLY_ACTIVE_ARCH: YES
        OTHER_LDFLAGS: ["$(inherited)", "-ObjC"]
    entitlements:
      path: Afterna/Afterna.entitlements
    dependencies:
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - target: AfternaWidgets
    scheme:
      testTargets: []

  AfternaWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: AfternaWidgets
        excludes:
          - "**/.DS_Store"
      - path: Afterna/LiveActivity/RecordingActivityAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.afterna.ios.widgets
        PRODUCT_NAME: AfternaWidgets
        DEVELOPMENT_TEAM: V5GB46FZ48
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Afterna
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks", "@executable_path/../../Frameworks"]
    scheme:
      testTargets: []
