# Fly app for Afterna API (monorepo root).
# Launch / deploy from the REPO ROOT so Fly finds this file + Dockerfile.
#
#   fly launch --copy-config --no-deploy
#   fly secrets set ...
#   fly deploy
#
# Or from backend/: use backend/fly.toml + backend/Dockerfile instead.

app = "afterna"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  FIXTURE_MODE = "false"
  NODE_ENV = "production"

[processes]
  app = "npx tsx src/index.ts"
  worker = "npx tsx src/worker.ts"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
  processes = ["worker"]
