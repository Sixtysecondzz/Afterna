# Fly app for Afterna API (monorepo root).
# Deploy from Fly dashboard / GitHub — uses this file + root Dockerfile.

app = "afterna"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  FIXTURE_MODE = "false"
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
